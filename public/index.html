<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazin Imprimante 3D</title>
    <link rel="icon" type="images/favicon1.png" href="/images/favicon1.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<!-- Navbar -->

<nav class="navbar glass-navbar fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="/images/logo.png" alt="Logo" width="50" height="50" class="ms-2 me-3">
      <span class="fw-bold nume-magazin">Imprimante 3D Shop</span>
    </a>
  </div>
</nav>

<!-- Hero Section -->
<div class="hero-video-container position-relative overflow-hidden text-center text-white d-flex align-items-center">
    <video autoplay loop muted playsinline class="bg-video">
    <source src="/images/video_printing.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <div class="container position-relative content-z-index py-5 my-5">
    <h1 class="display-4 fw-bold">Printează-ți Ideile în 3D</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Găsește imprimanta perfectă pentru proiectele tale. De la prototipuri rapide la piese de precizie, oferim echipamente de top pentru toate nevoile tale de fabricație digitală.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <button type="button" class="btn btn-outline-light btn-lg px-4">Vezi produsele</button>
        <button type="button" class="btn btn-outline-light btn-lg px-4">Află Mai Multe</button>
      </div>
    </div>
  </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>   
    <script src="app.js"></script>
</body>
</html>
